# One service on purpose: the Node server also serves the built client and the Socket.IO endpoint,
# so there is a single public port and no reverse proxy to misconfigure.
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: warzone2d:latest
    container_name: warzone2d
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      FIRE_COOLDOWN_MS: "${FIRE_COOLDOWN_MS:-350}"
      MATCH_DURATION_MS: "${MATCH_DURATION_MS:-180000}"
    ports:
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
